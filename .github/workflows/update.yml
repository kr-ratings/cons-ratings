name: 수집 및 배포

on:
  schedule:
    - cron: "50 22 * * *"   # 매일 07:50 KST 시작 → 8시 전후 갱신 (전날 22:50 UTC). 정각은 GitHub 대기열이 몰려 지연되므로 10분 앞당김
  workflow_dispatch: {}     # Actions 탭에서 'Run workflow'로 즉시 실행
  push:
    branches: [main]
    paths: ["index.html", "data/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cons-ratings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 원 출처에서 수집
        if: github.event_name != 'push'
        run: |
          pip install requests beautifulsoup4 openpyxl
          python collector/collect.py
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}   # Open DART 인증키(없으면 공시·재무만 건너뜀)

      - name: 수집 결과 커밋
        if: github.event_name != 'push'
        run: |
          git config user.name "cons-ratings-bot"
          git config user.email "cons-ratings-bot@users.noreply.github.com"
          git add data/ collector/dart_ids.json 2>/dev/null || git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST 정기 갱신"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: 배포 파일 모으기
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/
          cp og.png robots.txt sitemap.xml _site/ 2>/dev/null || true

      # GitHub Pages 배포. Cloudflare Pages만 쓰는 경우를 대비해 실패해도 넘어간다.
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
