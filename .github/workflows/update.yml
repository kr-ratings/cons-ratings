name: 수집 및 배포

on:
  schedule:
    - cron: "10 22 * * 0"   # 매주 월요일 07:10 KST (일요일 22:10 UTC)
  workflow_dispatch: {}     # Actions 탭에서 'Run workflow'로 즉시 실행
  push:
    branches: [main]
    paths: ["index.html", "data/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cons-ratings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 원 출처에서 수집
        if: github.event_name != 'push'
        run: |
          pip install requests beautifulsoup4 openpyxl
          python collector/collect.py

      - name: 수집 결과 커밋
        if: github.event_name != 'push'
        run: |
          git config user.name "cons-ratings-bot"
          git config user.email "cons-ratings-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST 주간 갱신"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: 배포 파일 모으기
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/

      # GitHub Pages 배포. Cloudflare Pages만 쓰는 경우를 대비해 실패해도 넘어간다.
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
